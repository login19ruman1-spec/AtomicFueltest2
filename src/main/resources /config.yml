# AtomicFuel is a fictional Minecraft gameplay system.
energy:
  per-tick-base: 10
  per-tick-per-enrichment: 5
  battery-capacity: 100000
  redstone-buffer-capacity: 500000

cooling:
  water-cool-per-tick: 5
  charge-water-every-seconds: 30
  charged-water-heat-penalty: -2

radiation:
  zone-radius-water: 8
  zone-radius-explosion: 30
  duration-seconds: 120
  expand-every-seconds: 30
  effect-tick-interval: 20
  water-cleanup-reduction: 2
  radaway-reduction: 5

reactor:
  countdown-seconds: 10
  stability-decay-per-tick: 0.05
  temperature-max: 1000
  temperature-meltdown: 900
  control-rod-bonus: 25
  coolant-reduction: 150
  heat-spike-on-remove: 200
  max-enrichment: 10

explosion:
  power: 40
  destroy-blocks: true
  fire: true
  knockback: 2.5
  crater-radius: 8

byproduct:
  every-seconds: 60
  items:
    - TRITIUM_DUST
    - ENRICHED_IRON
    - RARE_ISOTOPE

buff-zone:
  radius: 16
  stable-buffs:
    - HASTE:1
    - NIGHT_VISION:1
    - REGENERATION:1
